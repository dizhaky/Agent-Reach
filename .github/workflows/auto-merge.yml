# Legacy enrollment is retired. Only the central AI controller may queue PRs.
name: Auto-Merge Qualified PRs
'on':
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - unlabeled
  workflow_run:
    workflows:
      - CI
      - ci
      - Tests
      - tests
      - Lint
      - lint
      - Secret Scan
      - secret-scan
      - DeepSeek PR Review
      - deepseek-review
      - Auto-Label PRs
      - Codex Review Webhook
    types:
      - completed
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number (leave empty to evaluate all open PRs)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.event.inputs.pull_request_number
    || github.run_id }}
  cancel-in-progress: false
jobs:
  auto-merge:
    name: Auto-Merge
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request'
      && !github.event.pull_request.draft) || (github.event_name == 'workflow_run' && (github.event.workflow_run.head_repository.full_name
      == github.repository || github.event.workflow_run.head_repository == null))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report retired local enrollment
        run: |
          printf '%s\n' \
            'Legacy repository enrollment is retired.' \
            'The central AI controller owns queue writes after verified review, tests, and native protection gates.' \
            'This reporter cannot enroll, merge, convert drafts, or change repository settings.' \
            >> "$GITHUB_STEP_SUMMARY"
